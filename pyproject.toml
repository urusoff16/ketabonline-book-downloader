[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ketabonline-downloader"
version = "0.1.0"
description = "Resumable structured-text archiver for publicly accessible KetabOnline books"
keywords = ["ketabonline", "book-downloader", "arabic-books", "tkinter", "jsonl", "markdown"]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "urusoff16"}]
dependencies = []

[project.urls]
Repository = "https://github.com/urusoff16/ketabonline-book-downloader"
Issues = "https://github.com/urusoff16/ketabonline-book-downloader/issues"

[project.scripts]
ketab-download = "ketab_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["ketab_downloader*"]
